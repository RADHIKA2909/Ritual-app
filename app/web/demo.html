<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritual — Live Demo</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0F0E17;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 16px;
    }
    .label {
      color: rgba(240, 238, 255, 0.55);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .label a {
      color: rgba(240, 238, 255, 0.85);
      text-decoration: none;
      border-bottom: 1px solid rgba(240, 238, 255, 0.3);
    }
    .label a:hover { border-bottom-color: rgba(240, 238, 255, 0.7); }
    .phone {
      width: 390px;
      height: 844px;
      max-width: 100%;
      max-height: 82vh;
      border-radius: 36px;
      padding: 10px;
      background: linear-gradient(160deg, #2a2440, #14101f);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(240, 238, 255, 0.06);
    }
    .phone iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 26px;
      background: #0F0E17;
      display: block;
    }
    @media (max-width: 460px) {
      .phone { border-radius: 0; padding: 0; width: 100%; height: 100vh; max-height: 100vh; box-shadow: none; }
      .phone iframe { border-radius: 0; }
      .label { display: none; }
      .wrap { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">Ritual, previewed at phone width &middot; <a href="/" target="_blank" rel="noopener">open in a new tab &#8599;</a></div>
    <div class="phone">
      <iframe src="/" title="Ritual"></iframe>
    </div>
  </div>
</body>
</html>
